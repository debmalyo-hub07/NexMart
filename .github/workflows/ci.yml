name: CI

# Quality gate for both apps. Runs on every PR and on pushes to main so the
# default branch can never silently become unbuildable (directive §51).
on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch/PR cancels the previous, still-running check.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint · typecheck · build · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches render.yaml (production runtime)
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  frontend:
    name: Frontend · lint · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22' # matches netlify.toml
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - name: Build
        run: npm run build
        env:
          # Build-time placeholders only — never real secrets. The app reads
          # its real config at runtime; these just let `next build` complete
          # without a live backend or auth provider present in CI.
          NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
          AUTH_SECRET: ci-build-placeholder-not-used-at-runtime
          NEXTAUTH_URL: http://localhost:3000
