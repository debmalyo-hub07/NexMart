# Netlify configuration — Next.js monorepo
#
# The automatic OpenNext adapter was not engaging on the noble build system
# (framework detected, build ran, but 0 functions deployed and the raw .next
# folder was published as static files → 404 everywhere). Declaring the
# plugin explicitly forces the Next.js runtime to run regardless of the
# auto-detection path.

[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
